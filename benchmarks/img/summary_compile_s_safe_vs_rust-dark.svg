<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" width="900" height="515" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#343a35;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#a1aaa2;font-size:11px}.lbl{fill:#e8ece6;font-size:12.5px}.val{fill:#e8ece6;font-size:12px}.grp{fill:#a1aaa2;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#e8ece6;font-size:15px;font-weight:600}.sub{fill:#a1aaa2;font-size:11.5px}.k-caspien{--c:#5cb37f}.k-c{--c:#e16e68}.k-cpp{--c:#f3978e}.k-rust{--c:#bb5954}.k-go{--c:#f5b7b0}.k-fortran{--c:#9a504c}.k-objc{--c:#cc817a}.k-odin{--c:#ed9381}.k-zig{--c:#d5728b}.k-chapel{--c:#f7c8c0}.k-ldc{--c:#e77869}.k-gdc{--c:#f3a497}.k-nim{--c:#c85f5a}.k-crystal{--c:#e18b7e}.k-ocaml{--c:#f9d1ca}.k-swift{--c:#d66578}.k-codon{--c:#ad5e59}.k-java{--c:#9769c8}.k-csharp{--c:#826ed4}.k-kotlin{--c:#c18be1}.k-wasm{--c:#b09ae7}.k-node{--c:#5d8fdf}.k-bun{--c:#9bc1f5}.k-luajit{--c:#4f72bb}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#28402f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5cb37f" stroke-width="2.4"/></pattern></defs><rect width="900" height="515" rx="8" fill="#1f2220" stroke="#3a413b"/><text class="ttl" x="16" y="24">Compile time: memory-safe implementations, relative to Rust -O (free build)</text><text class="sub" x="16" y="40">Geometric mean of compile time / Rust -O (free build) on the same program, over the programs where both exist. Lower is better; 1x = Rust -O (free build).</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="403"/><text class="tick" x="300.0" y="417" text-anchor="middle">0.1x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="403"/><text class="tick" x="450.0" y="417" text-anchor="middle">1x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="403"/><text class="tick" x="600.0" y="417" text-anchor="middle">10x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="403"/><text class="tick" x="750.0" y="417" text-anchor="middle">100x</text><text class="tick" x="892" y="417" text-anchor="end">log scale</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="8" width="47.0" height="17" rx="3"/><text class="val" x="353.0" y="20.2">0.21x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="31" width="109.6" height="17" rx="3"/><text class="val" x="415.6" y="43.2">0.54x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="54" width="150.0" height="17" rx="3"/><text class="val" x="456.0" y="66.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="77" width="215.5" height="17" rx="3"/><text class="val" x="521.5" y="89.2">2.73x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="100" width="249.6" height="17" rx="3"/><text class="val" x="555.6" y="112.2">4.61x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="123" width="257.9" height="17" rx="3"/><text class="val" x="563.9" y="135.2">5.24x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="146" width="264.5" height="17" rx="3"/><text class="val" x="570.5" y="158.2">5.80x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="169" width="284.9" height="17" rx="3"/><text class="val" x="590.9" y="181.2">7.93x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">Caspien naive, optimisations off</text><rect class="bar k-caspien off" x="300" y="192" width="294.3" height="17" rx="3"/><text class="val" x="600.3" y="204.2">9.16x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="215" width="304.3" height="17" rx="3"/><text class="val" x="610.3" y="227.2">10.68x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Caspien ref safe [3 programs]</text><rect class="bar k-caspien" x="300" y="238" width="312.3" height="17" rx="3"/><text class="val" x="618.3" y="250.2">12.09x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Caspien optimized (safe), tuned per program</text><rect class="bar k-caspien" x="300" y="261" width="314.0" height="17" rx="3"/><text class="val" x="620.0" y="273.2">12.40x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="284" width="314.0" height="17" rx="3"/><text class="val" x="620.0" y="296.2">12.40x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Caspien ref naive [3 programs]</text><rect class="bar k-caspien" x="300" y="307" width="314.7" height="17" rx="3"/><text class="val" x="620.7" y="319.2">12.54x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="330" width="317.1" height="17" rx="3"/><text class="val" x="623.1" y="342.2">13.00x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="353" width="317.2" height="17" rx="3"/><text class="val" x="623.2" y="365.2">13.03x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="376" width="357.0" height="17" rx="3"/><text class="val" x="663.0" y="388.2">24.01x</text></g></g><text class="sub" x="16" y="489">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="503">Safe filter: Caspien without unsafe-dynarray variants, GC/runtime-safe languages, Rust where rustc accepts the port under -F unsafe_code.</text></svg>
