<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 423" width="900" height="423" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#343a35;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#a1aaa2;font-size:11px}.lbl{fill:#e8ece6;font-size:12.5px}.val{fill:#e8ece6;font-size:12px}.grp{fill:#a1aaa2;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#e8ece6;font-size:15px;font-weight:600}.sub{fill:#a1aaa2;font-size:11.5px}.k-caspien{--c:#5cb37f}.k-c{--c:#e16e68}.k-cpp{--c:#f3978e}.k-rust{--c:#bb5954}.k-go{--c:#f5b7b0}.k-fortran{--c:#9a504c}.k-objc{--c:#cc817a}.k-odin{--c:#ed9381}.k-zig{--c:#d5728b}.k-chapel{--c:#f7c8c0}.k-ldc{--c:#e77869}.k-gdc{--c:#f3a497}.k-nim{--c:#c85f5a}.k-crystal{--c:#e18b7e}.k-ocaml{--c:#f9d1ca}.k-swift{--c:#d66578}.k-codon{--c:#ad5e59}.k-java{--c:#9769c8}.k-csharp{--c:#826ed4}.k-kotlin{--c:#c18be1}.k-wasm{--c:#b09ae7}.k-node{--c:#5d8fdf}.k-bun{--c:#9bc1f5}.k-luajit{--c:#4f72bb}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#28402f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5cb37f" stroke-width="2.4"/></pattern></defs><rect width="900" height="423" rx="8" fill="#1f2220" stroke="#3a413b"/><text class="ttl" x="16" y="24">Execution time: memory-safe implementations, relative to Rust -O (free build)</text><text class="sub" x="16" y="40">Geometric mean of execution time / Rust -O (free build) on the same program, over the programs where both exist. Lower is better; 1x = Rust -O (free build).</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="311"/><text class="tick" x="300.0" y="325" text-anchor="middle">0x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="311"/><text class="tick" x="450.0" y="325" text-anchor="middle">1x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="311"/><text class="tick" x="600.0" y="325" text-anchor="middle">2x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="311"/><text class="tick" x="750.0" y="325" text-anchor="middle">3x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="8" width="150.0" height="17" rx="3"/><text class="val" x="456.0" y="20.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="31" width="176.5" height="17" rx="3"/><text class="val" x="482.5" y="43.2">1.18x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="54" width="176.9" height="17" rx="3"/><text class="val" x="482.9" y="66.2">1.18x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="77" width="196.3" height="17" rx="3"/><text class="val" x="502.3" y="89.2">1.31x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="100" width="206.7" height="17" rx="3"/><text class="val" x="512.7" y="112.2">1.38x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="123" width="212.7" height="17" rx="3"/><text class="val" x="518.7" y="135.2">1.42x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="146" width="229.7" height="17" rx="3"/><text class="val" x="535.7" y="158.2">1.53x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="169" width="231.8" height="17" rx="3"/><text class="val" x="537.8" y="181.2">1.55x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="192" width="234.6" height="17" rx="3"/><text class="val" x="540.6" y="204.2">1.56x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="215" width="294.0" height="17" rx="3"/><text class="val" x="600.0" y="227.2">1.96x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="238" width="305.7" height="17" rx="3"/><text class="val" x="611.7" y="250.2">2.04x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="261" width="338.7" height="17" rx="3"/><text class="val" x="644.7" y="273.2">2.26x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="284" width="366.3" height="17" rx="3"/><text class="val" x="672.3" y="296.2">2.44x</text></g></g><text class="sub" x="16" y="397">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="411">Safe filter: Caspien without unsafe-dynarray variants, GC/runtime-safe languages, Rust where rustc accepts the port under -F unsafe_code.  &gt;= : time cut off in a quick run (lower bound).</text></svg>
