<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-wasm{--c:#9a7ee0}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="722" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Execution time: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of execution time / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="610"/><text class="tick" x="300.0" y="624" text-anchor="middle">0x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="610"/><text class="tick" x="450.0" y="624" text-anchor="middle">1x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="610"/><text class="tick" x="600.0" y="624" text-anchor="middle">2x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="610"/><text class="tick" x="750.0" y="624" text-anchor="middle">3x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="142.4" height="17" rx="3"/><text class="val" x="448.4" y="20.2">0.95x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="150.0" height="17" rx="3"/><text class="val" x="456.0" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="54" width="150.5" height="17" rx="3"/><text class="val" x="456.5" y="66.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="77" width="158.2" height="17" rx="3"/><text class="val" x="464.2" y="89.2">1.05x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="100" width="159.6" height="17" rx="3"/><text class="val" x="465.6" y="112.2">1.06x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">D (LDC)</text><rect class="bar k-ldc" x="300" y="123" width="161.1" height="17" rx="3"/><text class="val" x="467.1" y="135.2">1.07x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="146" width="165.1" height="17" rx="3"/><text class="val" x="471.1" y="158.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">WebAssembly</text><rect class="bar k-wasm" x="300" y="169" width="168.4" height="17" rx="3"/><text class="val" x="474.4" y="181.2">1.12x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="192" width="176.2" height="17" rx="3"/><text class="val" x="482.2" y="204.2">1.17x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">D (GDC)</text><rect class="bar k-gdc" x="300" y="215" width="185.9" height="17" rx="3"/><text class="val" x="491.9" y="227.2">1.24x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Caspien optimized (unsafe), everything on</text><rect class="bar k-caspien" x="300" y="238" width="186.7" height="17" rx="3"/><text class="val" x="492.7" y="250.2">1.24x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="261" width="186.8" height="17" rx="3"/><text class="val" x="492.8" y="273.2">1.25x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="284" width="188.3" height="17" rx="3"/><text class="val" x="494.3" y="296.2">1.26x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="307" width="188.8" height="17" rx="3"/><text class="val" x="494.8" y="319.2">1.26x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">Codon</text><rect class="bar k-codon" x="300" y="330" width="197.6" height="17" rx="3"/><text class="val" x="503.6" y="342.2">1.32x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="353" width="208.9" height="17" rx="3"/><text class="val" x="514.9" y="365.2">1.39x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="376" width="219.9" height="17" rx="3"/><text class="val" x="525.9" y="388.2">1.47x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="399" width="226.3" height="17" rx="3"/><text class="val" x="532.3" y="411.2">1.51x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="422" width="244.5" height="17" rx="3"/><text class="val" x="550.5" y="434.2">1.63x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="445" width="246.4" height="17" rx="3"/><text class="val" x="552.4" y="457.2">1.64x</text></g><g class="row"><text class="lbl" x="292" y="480.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="468" width="246.7" height="17" rx="3"/><text class="val" x="552.7" y="480.2">1.64x</text></g><g class="row"><text class="lbl" x="292" y="503.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="491" width="249.7" height="17" rx="3"/><text class="val" x="555.7" y="503.2">1.66x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="514" width="312.9" height="17" rx="3"/><text class="val" x="618.9" y="526.2">2.09x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="537" width="325.3" height="17" rx="3"/><text class="val" x="631.3" y="549.2">2.17x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="560" width="360.4" height="17" rx="3"/><text class="val" x="666.4" y="572.2">2.40x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="583" width="389.8" height="17" rx="3"/><text class="val" x="695.8" y="595.2">2.60x</text></g></g><text class="sub" x="16" y="696">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="710">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.  &gt;= : time cut off in a quick run (lower bound).</text></svg>
