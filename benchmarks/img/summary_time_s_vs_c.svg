<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 952" width="900" height="952" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-wasm{--c:#9a7ee0}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="952" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Execution time: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of execution time / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="840"/><text class="tick" x="300.0" y="854" text-anchor="middle">0.1x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="840"/><text class="tick" x="450.0" y="854" text-anchor="middle">1x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="840"/><text class="tick" x="600.0" y="854" text-anchor="middle">10x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="840"/><text class="tick" x="750.0" y="854" text-anchor="middle">100x</text><text class="tick" x="892" y="854" text-anchor="end">log scale</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="146.7" height="17" rx="3"/><text class="val" x="452.7" y="20.2">0.95x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="150.0" height="17" rx="3"/><text class="val" x="456.0" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="54" width="150.5" height="17" rx="3"/><text class="val" x="456.5" y="66.2">1.01x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Caspien optimized (unsafe), everything on</text><rect class="bar k-caspien" x="300" y="77" width="152.2" height="17" rx="3"/><text class="val" x="458.2" y="89.2">1.03x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Caspien optimized (unsafe), tuned per program</text><rect class="bar k-caspien" x="300" y="100" width="152.4" height="17" rx="3"/><text class="val" x="458.4" y="112.2">1.04x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="123" width="153.1" height="17" rx="3"/><text class="val" x="459.1" y="135.2">1.05x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="146" width="153.7" height="17" rx="3"/><text class="val" x="459.7" y="158.2">1.06x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="169" width="155.7" height="17" rx="3"/><text class="val" x="461.7" y="181.2">1.09x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">D (LDC)</text><rect class="bar k-ldc" x="300" y="192" width="155.7" height="17" rx="3"/><text class="val" x="461.7" y="204.2">1.09x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Caspien optimized (safe), tuned per program</text><rect class="bar k-caspien" x="300" y="215" width="156.3" height="17" rx="3"/><text class="val" x="462.3" y="227.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="238" width="156.5" height="17" rx="3"/><text class="val" x="462.5" y="250.2">1.11x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">WebAssembly</text><rect class="bar k-wasm" x="300" y="261" width="157.4" height="17" rx="3"/><text class="val" x="463.4" y="273.2">1.12x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="284" width="160.5" height="17" rx="3"/><text class="val" x="466.5" y="296.2">1.18x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="307" width="163.4" height="17" rx="3"/><text class="val" x="469.4" y="319.2">1.23x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">D (GDC)</text><rect class="bar k-gdc" x="300" y="330" width="164.8" height="17" rx="3"/><text class="val" x="470.8" y="342.2">1.26x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="353" width="165.3" height="17" rx="3"/><text class="val" x="471.3" y="365.2">1.27x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">Codon</text><rect class="bar k-codon" x="300" y="376" width="169.7" height="17" rx="3"/><text class="val" x="475.7" y="388.2">1.35x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="399" width="172.6" height="17" rx="3"/><text class="val" x="478.6" y="411.2">1.41x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="422" width="175.3" height="17" rx="3"/><text class="val" x="481.3" y="434.2">1.47x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="445" width="177.3" height="17" rx="3"/><text class="val" x="483.3" y="457.2">1.52x</text></g><g class="row"><text class="lbl" x="292" y="480.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="468" width="179.9" height="17" rx="3"/><text class="val" x="485.9" y="480.2">1.58x</text></g><g class="row"><text class="lbl" x="292" y="503.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="491" width="181.9" height="17" rx="3"/><text class="val" x="487.9" y="503.2">1.63x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="514" width="182.2" height="17" rx="3"/><text class="val" x="488.2" y="526.2">1.64x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="537" width="182.4" height="17" rx="3"/><text class="val" x="488.4" y="549.2">1.64x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="560" width="192.0" height="17" rx="3"/><text class="val" x="498.0" y="572.2">1.91x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="583" width="192.1" height="17" rx="3"/><text class="val" x="498.1" y="595.2">1.91x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="606" width="197.5" height="17" rx="3"/><text class="val" x="503.5" y="618.2">2.07x</text></g><g class="row"><text class="lbl" x="292" y="641.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="629" width="207.0" height="17" rx="3"/><text class="val" x="513.0" y="641.2">2.40x</text></g><g class="row"><text class="lbl" x="292" y="664.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="652" width="212.3" height="17" rx="3"/><text class="val" x="518.3" y="664.2">2.60x</text></g><g class="row"><text class="lbl" x="292" y="687.2" text-anchor="end">Caspien optimized (unsafe), optimisations off</text><rect class="bar k-caspien off" x="300" y="675" width="238.2" height="17" rx="3"/><text class="val" x="544.2" y="687.2">3.87x</text></g><g class="row"><text class="lbl" x="292" y="710.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="698" width="250.1" height="17" rx="3"/><text class="val" x="556.1" y="710.2">4.65x</text></g><g class="row"><text class="lbl" x="292" y="733.2" text-anchor="end">Caspien naive, optimisations off</text><rect class="bar k-caspien off" x="300" y="721" width="287.0" height="17" rx="3"/><text class="val" x="593.0" y="733.2">8.19x</text></g><g class="row"><text class="lbl" x="292" y="756.2" text-anchor="end">Caspien ref unsafe [3 programs]</text><rect class="bar k-caspien" x="300" y="744" width="340.9" height="17" rx="3"/><text class="val" x="646.9" y="756.2">18.75x</text></g><g class="row"><text class="lbl" x="292" y="779.2" text-anchor="end">Caspien ref naive [3 programs]</text><rect class="bar k-caspien" x="300" y="767" width="343.1" height="17" rx="3"/><text class="val" x="649.1" y="779.2">19.39x</text></g><g class="row"><text class="lbl" x="292" y="802.2" text-anchor="end">Caspien ref safe [3 programs]</text><rect class="bar k-caspien" x="300" y="790" width="343.3" height="17" rx="3"/><text class="val" x="649.3" y="802.2">19.43x</text></g><g class="row"><text class="lbl" x="292" y="825.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="813" width="343.9" height="17" rx="3"/><text class="val" x="649.9" y="825.2">19.60x</text></g></g><text class="sub" x="16" y="926">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="940">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.  &gt;= : time cut off in a quick run (lower bound).</text></svg>
