<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 952" width="900" height="952" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#343a35;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#a1aaa2;font-size:11px}.lbl{fill:#e8ece6;font-size:12.5px}.val{fill:#e8ece6;font-size:12px}.grp{fill:#a1aaa2;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#e8ece6;font-size:15px;font-weight:600}.sub{fill:#a1aaa2;font-size:11.5px}.k-caspien{--c:#5cb37f}.k-c{--c:#e16e68}.k-cpp{--c:#f3978e}.k-rust{--c:#bb5954}.k-go{--c:#f5b7b0}.k-fortran{--c:#9a504c}.k-objc{--c:#cc817a}.k-odin{--c:#ed9381}.k-zig{--c:#d5728b}.k-chapel{--c:#f7c8c0}.k-ldc{--c:#e77869}.k-gdc{--c:#f3a497}.k-nim{--c:#c85f5a}.k-crystal{--c:#e18b7e}.k-ocaml{--c:#f9d1ca}.k-swift{--c:#d66578}.k-codon{--c:#ad5e59}.k-java{--c:#9769c8}.k-csharp{--c:#826ed4}.k-kotlin{--c:#c18be1}.k-wasm{--c:#b09ae7}.k-node{--c:#5d8fdf}.k-bun{--c:#9bc1f5}.k-luajit{--c:#4f72bb}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#28402f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5cb37f" stroke-width="2.4"/></pattern></defs><rect width="900" height="952" rx="8" fill="#1f2220" stroke="#3a413b"/><text class="ttl" x="16" y="24">Execution time: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of execution time / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="840"/><text class="tick" x="300.0" y="854" text-anchor="middle">0x</text><line class="grid" x1="337.5" x2="337.5" y1="6" y2="840"/><text class="tick" x="337.5" y="854" text-anchor="middle">1x</text><line class="grid" x1="375.0" x2="375.0" y1="6" y2="840"/><text class="tick" x="375.0" y="854" text-anchor="middle">2x</text><line class="grid" x1="412.5" x2="412.5" y1="6" y2="840"/><text class="tick" x="412.5" y="854" text-anchor="middle">3x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="840"/><text class="tick" x="450.0" y="854" text-anchor="middle">4x</text><line class="grid" x1="487.5" x2="487.5" y1="6" y2="840"/><text class="tick" x="487.5" y="854" text-anchor="middle">5x</text><line class="grid" x1="525.0" x2="525.0" y1="6" y2="840"/><text class="tick" x="525.0" y="854" text-anchor="middle">6x</text><line class="grid" x1="562.5" x2="562.5" y1="6" y2="840"/><text class="tick" x="562.5" y="854" text-anchor="middle">7x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="840"/><text class="tick" x="600.0" y="854" text-anchor="middle">8x</text><line class="grid" x1="637.5" x2="637.5" y1="6" y2="840"/><text class="tick" x="637.5" y="854" text-anchor="middle">9x</text><line class="grid" x1="675.0" x2="675.0" y1="6" y2="840"/><text class="tick" x="675.0" y="854" text-anchor="middle">10x</text><line class="grid" x1="712.5" x2="712.5" y1="6" y2="840"/><text class="tick" x="712.5" y="854" text-anchor="middle">11x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="840"/><text class="tick" x="750.0" y="854" text-anchor="middle">12x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="36.4" height="17" rx="3"/><text class="val" x="342.4" y="20.2">0.97x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="37.5" height="17" rx="3"/><text class="val" x="343.5" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="54" width="38.6" height="17" rx="3"/><text class="val" x="344.6" y="66.2">1.03x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300"