class="lbl" x="292" y="342.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="330" width="62.3" height="17" rx="3"/><text class="val" x="368.3" y="342.2">1.25x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="353" width="62.8" height="17" rx="3"/><text class="val" x="368.8" y="365.2">1.26x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">Codon</text><rect class="bar k-codon" x="300" y="376" width="65.9" height="17" rx="3"/><text class="val" x="371.9" y="388.2">1.32x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="399" width="69.6" height="17" rx="3"/><text class="val" x="375.6" y="411.2">1.39x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="422" width="73.3" height="17" rx="3"/><text class="val" x="379.3" y="434.2">1.47x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="445" width="75.4" height="17" rx="3"/><text class="val" x="381.4" y="457.2">1.51x</text></g><g class="row"><text class="lbl" x="292" y="480.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="468" width="81.5" height="17" rx="3"/><text class="val" x="387.5" y="480.2">1.63x</text></g><g class="row"><text class="lbl" x="292" y="503.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="491" width="82.1" height="17" rx="3"/><text class="val" x="388.1" y="503.2">1.64x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="514" width="82.2" height="17" rx="3"/><text class="val" x="388.2" y="526.2">1.64x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="537" width="83.2" height="17" rx="3"/><text class="val" x="389.2" y="549.2">1.66x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="560" width="92.9" height="17" rx="3"/><text class="val" x="398.9" y="572.2">1.86x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="583" width="93.2" height="17" rx="3"/><text class="val" x="399.2" y="595.2">1.86x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="606" width="104.3" height="17" rx="3"/><text class="val" x="410.3" y="618.2">2.09x</text></g><g class="row"><text class="lbl" x="292" y="641.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="629" width="120.1" height="17" rx="3"/><text class="val" x="426.1" y="641.2">2.40x</text></g><g class="row"><text class="lbl" x="292" y="664.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="652" width="129.9" height="17" rx="3"/><text class="val" x="435.9" y="664.2">2.60x</text></g><g class="row"><text class="lbl" x="292" y="687.2" text-anchor="end">Caspien ref safe [3 programs]</text><rect class="bar k-caspien" x="300" y="675" width="382.6" height="17" rx="3"/><text class="val" x="688.6" y="687.2">7.65x</text></g><g class="row"><text class="lbl" x="292" y="710.2" text-anchor="end">Caspien ref naive [3 programs]</text><rect class="bar k-caspien" x="300" y="698" width="383.1" height="17" rx="3"/><text class="val" x="689.1" y="710.2">7.66x</text></g><g class="row"><text class="lbl" x="292" y="733.2" text-anchor="end">Caspien ref unsafe [3 programs]</text><rect class="bar k-caspien" x="300" y="721" width="388.7" height="17" rx="3"/><text class="val" x="694.7" y="733.2">7.77x</text></g><g class="row"><text class="lbl" x="292" y="756.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="744" width="440.6" height="17" rx="3"/><text class="val" x="746.6" y="756.2">8.81x</text></g></g><text class="sub" x="16" y="857">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="871">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.  &gt;= : time cut off in a quick run (lower bound).</text></svg>
