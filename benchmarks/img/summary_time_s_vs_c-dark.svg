<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 952" width="900" height="952" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#343a35;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#a1aaa2;font-size:11px}.lbl{fill:#e8ece6;font-size:12.5px}.val{fill:#e8ece6;font-size:12px}.grp{fill:#a1aaa2;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#e8ece6;font-size:15px;font-weight:600}.sub{fill:#a1aaa2;font-size:11.5px}.k-caspien{--c:#5cb37f}.k-c{--c:#e16e68}.k-cpp{--c:#f3978e}.k-rust{--c:#bb5954}.k-go{--c:#f5b7b0}.k-fortran{--c:#9a504c}.k-objc{--c:#cc817a}.k-odin{--c:#ed9381}.k-zig{--c:#d5728b}.k-chapel{--c:#f7c8c0}.k-ldc{--c:#e77869}.k-gdc{--c:#f3a497}.k-nim{--c:#c85f5a}.k-crystal{--c:#e18b7e}.k-ocaml{--c:#f9d1ca}.k-swift{--c:#d66578}.k-codon{--c:#ad5e59}.k-java{--c:#9769c8}.k-csharp{--c:#826ed4}.k-kotlin{--c:#c18be1}.k-wasm{--c:#b09ae7}.k-node{--c:#5d8fdf}.k-bun{--c:#9bc1f5}.k-luajit{--c:#4f72bb}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#28402f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5cb37f" stroke-width="2.4"/></pattern></defs><rect width="900" height="952" rx="8" fill="#1f2220" stroke="#3a413b"/><text class="ttl" x="16" y="24">Execution time: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of execution time / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="840"/><text class="tick" x="300.0" y="854" text-anchor="middle">0x</text><line class="grid" x1="345.0" x2="345.0" y1="6" y2="840"/><text class="tick" x="345.0" y="854" text-anchor="middle">1x</text><line class="grid" x1="390.0" x2="390.0" y1="6" y2="840"/><text class="tick" x="390.0" y="854" text-anchor="middle">2x</text><line class="grid" x1="435.0" x2="435.0" y1="6" y2="840"/><text class="tick" x="435.0" y="854" text-anchor="middle">3x</text><line class="grid" x1="480.0" x2="480.0" y1="6" y2="840"/><text class="tick" x="480.0" y="854" text-anchor="middle">4x</text><line class="grid" x1="525.0" x2="525.0" y1="6" y2="840"/><text class="tick" x="525.0" y="854" text-anchor="middle">5x</text><line class="grid" x1="570.0" x2="570.0" y1="6" y2="840"/><text class="tick" x="570.0" y="854" text-anchor="middle">6x</text><line class="grid" x1="615.0" x2="615.0" y1="6" y2="840"/><text class="tick" x="615.0" y="854" text-anchor="middle">7x</text><line class="grid" x1="660.0" x2="660.0" y1="6" y2="840"/><text class="tick" x="660.0" y="854" text-anchor="middle">8x</text><line class="grid" x1="705.0" x2="705.0" y1="6" y2="840"/><text class="tick" x="705.0" y="854" text-anchor="middle">9x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="840"/><text class="tick" x="750.0" y="854" text-anchor="middle">10x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="43.7" height="17" rx="3"/><text class="val" x="349.7" y="20.2">0.97x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="45.0" height="17" rx="3"/><text class="val" x="351.0" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="54" width="45.3" height="17" rx="3"/><text class="val" x="351.3" y="66.2">1.01x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="77" width="47.0" height="17" rx="3"/><text class="val" x="353.0" y="89.2">1.04x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Caspien optimized (unsafe), tuned per program</text><rect class="bar k-caspien" x="300" y="100" width="48.7" height="17" rx="3"/><text class="val" x="354.7" y="112.2">1.08x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">Caspien optimized (unsafe), everything on</text><rect class="bar k-caspien" x="300" y="123" width="49.5" height="17" rx="3"/><text class="val" x="355.5" y="135.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="146" width="49.7" height="17" rx="3"/><text class="val" x="355.7" y="158.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">D (LDC)</text><rect class="bar k-ldc" x="300" y="169" width="50.0" height="17" rx="3"/><text class="val" x="356.0" y="181.2">1.11x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="192" width="50.8" height="17" rx="3"/><text class="val" x="356.8" y="204.2">1.13x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Caspien optimized (safe), tuned per program</text><rect class="bar k-caspien" x="300" y="215" width="52.1" height="17" rx="3"/><text class="val" x="358.1" y="227.2">1.16x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">WebAssembly</text><rect class="bar k-wasm" x="300" y="238" width="52.2" height="17" rx="3"/><text class="val" x="358.2" y="250.2">1.16x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="261" width="52.5" height="17" rx="3"/><text class="val" x="358.5" y="273.2">1.17x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="284" width="55.3" height="17" rx="3"/><text class="val" x="361.3" y="296.2">1.23x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="307" width="55.6" height="17" rx="3"/><text class="val" x="361.6" y="319.2">1.23x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">D (GDC)</text><rect class="bar k-gdc" x="300" y="330" width="56.9" height="17" rx="3"/><text class="val" x="362.9" y="342.2">1.26x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="353" width="59.0" height="17" rx="3"/><text class="val" x="365.0" y="365.2">1.31x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">Codon</text><rect class="bar k-codon" x="300" y="376" width="61.7" height="17" rx="3"/><text class="val" x="367.7" y="388.2">1.37x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="399" width="64.5" height="17" rx="3"/><text class="val" x="370.5" y="411.2">1.43x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="422" width="67.7" height="17" rx="3"/><text class="val" x="373.7" y="434.2">1.50x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="445" width="68.6" height="17" rx="3"/><text class="val" x="374.6" y="457.2">1.52x</text></g><g class="row"><text class="lbl" x="292" y="480.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="468" width="74.2" height="17" rx="3"/><text class="val" x="380.2" y="480.2">1.65x</text></g><g class="row"><text class="lbl" x="292" y="503.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="491" width="76.4" height="17" rx="3"/><text class="val" x="382.4" y="503.2">1.70x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="514" width="77.4" height="17" rx="3"/><text class="val" x="383.4" y="526.2">1.72x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="537" width="78.0" height="17" rx="3"/><text class="val" x="384.0" y="549.2">1.73x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="560" width="91.9" height="17" rx="3"/><text class="val" x="397.9" y="572.2">2.04x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="583" width="92.2" height="17" rx="3"/><text class="val" x="398.2" y="595.2">2.05x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="606" width="92.7" height="17" rx="3"/><text class="val" x="398.7" y="618.2">2.06x</text></g><g class="row"><text class="lbl" x="292" y="641.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="629" width="110.9" height="17" rx="3"/><text class="val" x="416.9" y="641.2">2.46x</text></g><g class="row"><text class="lbl" x="292" y="664.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="652" width="121.3" height="17" rx="3"/><text class="val" x="427.3" y="664.2">2.70x</text></g><g class="row"><text class="lbl" x="292" y="687.2" text-anchor="end">Caspien optimized (unsafe), optimisations off</text><rect class="bar k-caspien off" x="300" y="675" width="187.2" height="17" rx="3"/><text class="val" x="493.2" y="687.2">4.16x</text></g><g class="row"><text class="lbl" x="292" y="710.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="698" width="236.4" height="17" rx="3"/><text class="val" x="542.4" y="710.2">5.25x</text></g><g class="row"><text class="lbl" x="292" y="733.2" text-anchor="end">Caspien ref safe [3 programs]</text><rect class="bar k-caspien" x="300" y="721" width="323.2" height="17" rx="3"/><text class="val" x="629.2" y="733.2">7.18x</text></g><g class="row"><text class="lbl" x="292" y="756.2" text-anchor="end">Caspien ref unsafe [3 programs]</text><rect class="bar k-caspien" x="300" y="744" width="326.3" height="17" rx="3"/><text class="val" x="632.3" y="756.2">7.25x</text></g><g class="row"><text class="lbl" x="292" y="779.2" text-anchor="end">Caspien ref naive [3 programs]</text><rect class="bar k-caspien" x="300" y="767" width="362.6" height="17" rx="3"/><text class="val" x="668.6" y="779.2">8.06x</text></g><g class="row"><text class="lbl" x="292" y="802.2" text-anchor="end">Caspien naive, optimisations off</text><rect class="bar k-caspien off" x="300" y="790" width="383.7" height="17" rx="3"/><text class="val" x="689.7" y="802.2">8.53x</text></g><g class="row"><text class="lbl" x="292" y="825.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="813" width="428.5" height="17" rx="3"/><text class="val" x="734.5" y="825.2">9.52x</text></g></g><text class="sub" x="16" y="926">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="940">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.  &gt;= : time cut off in a quick run (lower bound).</text></svg>
