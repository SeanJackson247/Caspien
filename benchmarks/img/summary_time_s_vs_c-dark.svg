"369.2" y="503.2">1.68x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="514" width="63.5" height="17" rx="3"/><text class="val" x="369.5" y="526.2">1.69x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="537" width="64.6" height="17" rx="3"/><text class="val" x="370.6" y="549.2">1.72x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="560" width="78.8" height="17" rx="3"/><text class="val" x="384.8" y="572.2">2.10x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="583" width="78.9" height="17" rx="3"/><text class="val" x="384.9" y="595.2">2.10x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="606" width="81.6" height="17" rx="3"/><text class="val" x="387.6" y="618.2">2.18x</text></g><g class="row"><text class="lbl" x="292" y="641.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="629" width="93.7" height="17" rx="3"/><text class="val" x="399.7" y="641.2">2.50x</text></g><g class="row"><text class="lbl" x="292" y="664.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="652" width="100.3" height="17" rx="3"/><text class="val" x="406.3" y="664.2">2.67x</text></g><g class="row"><text class="lbl" x="292" y="687.2" text-anchor="end">Caspien optimized (unsafe), optimisations off</text><rect class="bar k-caspien off" x="300" y="675" width="154.6" height="17" rx="3"/><text class="val" x="460.6" y="687.2">4.12x</text></g><g class="row"><text class="lbl" x="292" y="710.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="698" width="185.5" height=