"val" x="728.7" y="365.2">49.80x</text></g></g><text class="sub" x="16" y="466">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="480">Safe filter: Caspien without unsafe-dynarray variants, GC/runtime-safe languages, Rust where rustc accepts the port under -F unsafe_code.</text></svg>
