ng on</text><rect class="bar k-caspien" x="300" y="583" width="283.6" height="17" rx="3"/><text class="val" x="589.6" y="595.2">33.21x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">Caspien optimized (unsafe), tuned per program</text><rect class="bar k-caspien" x="300" y="606" width="283.8" height="17" rx="3"/><text class="val" x="589.8" y="618.2">33.28x</text></g><g class="row"><text class="lbl" x="292" y="641.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="629" width="285.9" height="17" rx="3"/><text class="val" x="591.9" y="641.2">34.81x</text></g><g class="row"><text class="lbl" x="292" y="664.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="652" width="286.0" height="17" rx="3"/><text class="val" x="592.0" y="664.2">34.88x</text></g><g class="row"><text class="lbl" x="292" y="687.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="675" width="296.5" height="17" rx="3"/><text class="val" x="602.5" y="687.2">43.18x</text></g><g class="row"><text class="lbl" x="292" y="710.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="698" width="315.9" height="17" rx="3"/><text class="val" x="621.9" y="710.2">64.27x</text></g><g class="row"><text class="lbl" x="292" y="733.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="721" width="329.5" height="17" rx="3"/><text class="val" x="635.5" y="733.2">84.86x</text></g><g class="row"><text class="lbl" x="292" y="756.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="744" width="368.4" height="17" rx="3"/><text class="val" x="674.4" y="756.2">188.21x</text></g></g><text class="sub" x="16" y="857">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="871">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.</text></svg>
