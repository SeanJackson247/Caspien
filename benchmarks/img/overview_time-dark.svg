<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#343a35;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#a1aaa2;font-size:11px}.lbl{fill:#e8ece6;font-size:12.5px}.val{fill:#e8ece6;font-size:12px}.grp{fill:#a1aaa2;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#e8ece6;font-size:15px;font-weight:600}.sub{fill:#a1aaa2;font-size:11.5px}.k-caspien{--c:#5cb37f}.k-c{--c:#e16e68}.k-cpp{--c:#f3978e}.k-rust{--c:#bb5954}.k-go{--c:#f5b7b0}.k-fortran{--c:#9a504c}.k-objc{--c:#cc817a}.k-odin{--c:#ed9381}.k-zig{--c:#d5728b}.k-chapel{--c:#f7c8c0}.k-ldc{--c:#e77869}.k-gdc{--c:#f3a497}.k-nim{--c:#c85f5a}.k-crystal{--c:#e18b7e}.k-ocaml{--c:#f9d1ca}.k-swift{--c:#d66578}.k-codon{--c:#ad5e59}.k-java{--c:#9769c8}.k-csharp{--c:#826ed4}.k-kotlin{--c:#c18be1}.k-wasm{--c:#b09ae7}.k-node{--c:#5d8fdf}.k-bun{--c:#9bc1f5}.k-luajit{--c:#4f72bb}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#28402f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5cb37f" stroke-width="2.4"/></pattern></defs><rect width="900" height="745" rx="8" fill="#1f2220" stroke="#3a413b"/><text class="ttl" x="16" y="24">Caspien against 23 other languages: execution time over 13 programs</text><text class="sub" x="16" y="40">Geometric mean of time / C -O2 time over the same 13 programs for every row. Lower is faster; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="633"/><text class="tick" x="300.0" y="647" text-anchor="middle">0x</text><line class="grid" x1="340.9" x2="340.9" y1="6" y2="633"/><text class="tick" x="340.9" y="647" text-anchor="middle">1x</text><line class="grid" x1="381.8" x2="381.8" y1="6" y2="633"/><text class="tick" x="381.8" y="647" text-anchor="middle">2x</text><line class="grid" x1="422.7" x2="422.7" y1="6" y2="633"/><text class="tick" x="422.7" y="647" text-anchor="middle">3x</text><line class="grid" x1="463.6" x2="463.6" y1="6" y2="633"/><text class="tick" x="463.6" y="647" text-anchor="middle">4x</text><line class="grid" x1="504.5" x2="504.5" y1="6" y2="633"/><text class="tick" x="504.5" y="647" text-anchor="middle">5x</text><line class="grid" x1="545.5" x2="545.5" y1="6" y2="633"/><text class="tick" x="545.5" y="647" text-anchor="middle">6x</text><line class="grid" x1="586.4" x2="586.4" y1="6" y2="633"/><text class="tick" x="586.4" y="647" text-anchor="middle">7x</text><line class="grid" x1="627.3" x2="627.3" y1="6" y2="633"/><text class="tick" x="627.3" y="647" text-anchor="middle">8x</text><line class="grid" x1="668.2" x2="668.2" y1="6" y2="633"/><text class="tick" x="668.2" y="647" text-anchor="middle">9x</text><line class="grid" x1="709.1" x2="709.1" y1="6" y2="633"/><text class="tick" x="709.1" y="647" text-anchor="middle">10x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="633"/><text class="tick" x="750.0" y="647" text-anchor="middle">11x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="38.7" height="17" rx="3"/><text class="val" x="344.7" y="20.2">0.95x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="40.9" height="17" rx="3"/><text class="val" x="346.9" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="54" width="41.0" height="17" rx="3"/><text class="val" x="347.0" y="66.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="77" width="43.3" height="17" rx="3"/><text class="val" x="349.3" y="89.2">1.06x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="100" width="43.8" height="17" rx="3"/><text class="val" x="349.8" y="112.2">1.07x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">D (LDC)</text><rect class="bar k-ldc" x="300" y="123" width="44.2" height="17" rx="3"/><text class="val" x="350.2" y="135.2">1.08x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="146" width="45.4" height="17" rx="3"/><text class="val" x="351.4" y="158.2">1.11x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">WebAssembly</text><rect class="bar k-wasm" x="300" y="169" width="46.3" height="17" rx="3"/><text class="val" x="352.3" y="181.2">1.13x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="192" width="48.6" height="17" rx="3"/><text class="val" x="354.6" y="204.2">1.19x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">D (GDC)</text><rect class="bar k-gdc" x="300" y="215" width="51.6" height="17" rx="3"/><text class="val" x="357.6" y="227.2">1.26x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="238" width="51.8" height="17" rx="3"/><text class="val" x="357.8" y="250.2">1.27x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="261" width="52.2" height="17" rx="3"/><text class="val" x="358.2" y="273.2">1.28x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">Codon</text><rect class="bar k-codon" x="300" y="284" width="55.1" height="17" rx="3"/><text class="val" x="361.1" y="296.2">1.35x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="307" width="58.5" height="17" rx="3"/><text class="val" x="364.5" y="319.2">1.43x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="330" width="60.6" height="17" rx="3"/><text class="val" x="366.6" y="342.2">1.48x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="353" width="63.2" height="17" rx="3"/><text class="val" x="369.2" y="365.2">1.55x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="376" width="63.6" height="17" rx="3"/><text class="val" x="369.6" y="388.2">1.56x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="399" width="68.4" height="17" rx="3"/><text class="val" x="374.4" y="411.2">1.67x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="422" width="69.1" height="17" rx="3"/><text class="val" x="375.1" y="434.2">1.69x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="445" width="69.9" height="17" rx="3"/><text class="val" x="375.9" y="457.2">1.71x</text></g><g class="row"><text class="lbl" x="292" y="480.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="468" width="70.8" height="17" rx="3"/><text class="val" x="376.8" y="480.2">1.73x</text></g><g class="row"><text class="lbl" x="292" y="503.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="491" width="90.4" height="17" rx="3"/><text class="val" x="396.4" y="503.2">2.21x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="514" width="104.8" height="17" rx="3"/><text class="val" x="410.8" y="526.2">2.56x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="537" width="107.2" height="17" rx="3"/><text class="val" x="413.2" y="549.2">2.62x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="560" width="114.2" height="17" rx="3"/><text class="val" x="420.2" y="572.2">2.79x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="583" width="196.7" height="17" rx="3"/><text class="val" x="502.7" y="595.2">4.81x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">Caspien naive, optimisations off</text><rect class="bar k-caspien off" x="300" y="606" width="422.7" height="17" rx="3"/><text class="val" x="728.7" y="618.2">10.33x</text></g></g><text class="sub" x="16" y="719">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="733">Fastest of 3 runs, Linux 2-core VM. Hello World and Mandelbrot (one Caspien variant) are excluded; unsafe variants are in the per-program charts.</text></svg>
