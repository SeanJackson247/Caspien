<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-wasm{--c:#9a7ee0}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="584" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Execution time: memory-safe implementations, relative to Rust -O (free build)</text><text class="sub" x="16" y="40">Geometric mean of execution time / Rust -O (free build) on the same program, over the programs where both exist. Lower is better; 1x = Rust -O (free build).</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="472"/><text class="tick" x="300.0" y="486" text-anchor="middle">0x</text><line class="grid" x1="350.0" x2="350.0" y1="6" y2="472"/><text class="tick" x="350.0" y="486" text-anchor="middle">1x</text><line class="grid" x1="400.0" x2="400.0" y1="6" y2="472"/><text class="tick" x="400.0" y="486" text-anchor="middle">2x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="472"/><text class="tick" x="450.0" y="486" text-anchor="middle">3x</text><line class="grid" x1="500.0" x2="500.0" y1="6" y2="472"/><text class="tick" x="500.0" y="486" text-anchor="middle">4x</text><line class="grid" x1="550.0" x2="550.0" y1="6" y2="472"/><text class="tick" x="550.0" y="486" text-anchor="middle">5x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="472"/><text class="tick" x="600.0" y="486" text-anchor="middle">6x</text><line class="grid" x1="650.0" x2="650.0" y1="6" y2="472"/><text class="tick" x="650.0" y="486" text-anchor="middle">7x</text><line class="grid" x1="700.0" x2="700.0" y1="6" y2="472"/><text class="tick" x="700.0" y="486" text-anchor="middle">8x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="472"/><text class="tick" x="750.0" y="486" text-anchor="middle">9x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="8" width="50.0" height="17" rx="3"/><text class="val" x="356.0" y="20.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">Caspien optimized (safe), tuned per program</text><rect class="bar k-caspien" x="300" y="31" width="53.4" height="17" rx="3"/><text class="val" x="359.4" y="43.2">1.07x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="54" width="53.8" height="17" rx="3"/><text class="val" x="359.8" y="66.2">1.08x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="77" width="60.7" height="17" rx="3"/><text class="val" x="366.7" y="89.2">1.21x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="100" width="68.3" height="17" rx="3"/><text class="val" x="374.3" y="112.2">1.37x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="123" width="70.0" height="17" rx="3"/><text class="val" x="376.0" y="135.2">1.40x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="146" width="72.6" height="17" rx="3"/><text class="val" x="378.6" y="158.2">1.45x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="169" width="78.5" height="17" rx="3"/><text class="val" x="384.5" y="181.2">1.57x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="192" width="78.9" height="17" rx="3"/><text class="val" x="384.9" y="204.2">1.58x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="215" width="80.3" height="17" rx="3"/><text class="val" x="386.3" y="227.2">1.61x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="238" width="98.0" height="17" rx="3"/><text class="val" x="404.0" y="250.2">1.96x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="261" width="98.1" height="17" rx="3"/><text class="val" x="404.1" y="273.2">1.96x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="284" width="101.5" height="17" rx="3"/><text class="val" x="407.5" y="296.2">2.03x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="307" width="116.5" height="17" rx="3"/><text class="val" x="422.5" y="319.2">2.33x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="330" width="124.7" height="17" rx="3"/><text class="val" x="430.7" y="342.2">2.49x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="353" width="229.0" height="17" rx="3"/><text class="val" x="535.0" y="365.2">4.58x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="376" width="332.2" height="17" rx="3"/><text class="val" x="638.2" y="388.2">6.64x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">Caspien naive, optimisations off</text><rect class="bar k-caspien off" x="300" y="399" width="390.1" height="17" rx="3"/><text class="val" x="696.1" y="411.2">7.80x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">Caspien ref safe [3 programs]</text><rect class="bar k-caspien" x="300" y="422" width="425.7" height="17" rx="3"/><text class="val" x="731.7" y="434.2">8.51x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">Caspien ref naive [3 programs]</text><rect class="bar k-caspien" x="300" y="445" width="448.6" height="17" rx="3"/><text class="val" x="754.6" y="457.2">8.97x</text></g></g><text class="sub" x="16" y="558">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="572">Safe filter: Caspien without unsafe-dynarray variants, GC/runtime-safe languages, Rust where rustc accepts the port under -F unsafe_code.  &gt;= : time cut off in a quick run (lower bound).</text></svg>
