dth="386.2" height="17" rx="3"/><text class="val" x="692.2" y="342.2">6.87x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Caspien ref naive [3 programs]</text><rect class="bar k-caspien" x="300" y="353" width="423.8" height="17" rx="3"/><text class="val" x="729.8" y="365.2">7.53x</text></g></g><text class="sub" x="16" y="466">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="480">Safe filter: Caspien without unsafe-dynarray variants, GC/runtime-safe languages, Rust where rustc accepts the port under -F unsafe_code.  &gt;= : time cut off in a quick run (lower bound).</text></svg>
