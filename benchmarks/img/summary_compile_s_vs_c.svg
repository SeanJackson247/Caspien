<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 814" width="900" height="814" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-wasm{--c:#9a7ee0}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="814" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Compile time: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of compile time / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="702"/><text class="tick" x="300.0" y="716" text-anchor="middle">1x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="702"/><text class="tick" x="450.0" y="716" text-anchor="middle">10x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="702"/><text class="tick" x="600.0" y="716" text-anchor="middle">100x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="702"/><text class="tick" x="750.0" y="716" text-anchor="middle">1000x</text><text class="tick" x="892" y="716" text-anchor="end">log scale</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="8" width="1.5" height="17" rx="3"/><text class="val" x="307.5" y="20.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="31" width="10.1" height="17" rx="3"/><text class="val" x="316.1" y="43.2">1.17x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="54" width="17.2" height="17" rx="3"/><text class="val" x="323.2" y="66.2">1.30x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="77" width="23.8" height="17" rx="3"/><text class="val" x="329.8" y="89.2">1.44x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="100" width="64.3" height="17" rx="3"/><text class="val" x="370.3" y="112.2">2.68x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="123" width="83.3" height="17" rx="3"/><text class="val" x="389.3" y="135.2">3.59x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">D (LDC)</text><rect class="bar k-ldc" x="300" y="146" width="110.9" height="17" rx="3"/><text class="val" x="416.9" y="158.2">5.49x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">D (GDC)</text><rect class="bar k-gdc" x="300" y="169" width="114.1" height="17" rx="3"/><text class="val" x="420.1" y="181.2">5.76x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="192" width="133.6" height="17" rx="3"/><text class="val" x="439.6" y="204.2">7.77x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="215" width="167.6" height="17" rx="3"/><text class="val" x="473.6" y="227.2">13.10x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="238" width="186.0" height="17" rx="3"/><text class="val" x="492.0" y="250.2">17.37x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Caspien ref unsafe [3 programs]</text><rect class="bar k-caspien" x="300" y="261" width="195.4" height="17" rx="3"/><text class="val" x="501.4" y="273.2">20.08x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="284" width="196.7" height="17" rx="3"/><text class="val" x="502.7" y="296.2">20.48x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Caspien ref safe [3 programs]</text><rect class="bar k-caspien" x="300" y="307" width="196.7" height="17" rx="3"/><text class="val" x="502.7" y="319.2">20.48x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">Caspien ref naive [3 programs]</text><rect class="bar k-caspien" x="300" y="330" width="202.3" height="17" rx="3"/><text class="val" x="508.3" y="342.2">22.33x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Caspien optimized (unsafe), tuned per program</text><rect class="bar k-caspien" x="300" y="353" width="206.0" height="17" rx="3"/><text class="val" x="512.0" y="365.2">23.62x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">Caspien optimized (unsafe), everything on</text><rect class="bar k-caspien" x="300" y="376" width="206.6" height="17" rx="3"/><text class="val" x="512.6" y="388.2">23.86x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="399" width="208.5" height="17" rx="3"/><text class="val" x="514.5" y="411.2">24.54x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">Caspien optimized (safe), tuned per program</text><rect class="bar k-caspien" x="300" y="422" width="209.0" height="17" rx="3"/><text class="val" x="515.0" y="434.2">24.73x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="445" width="217.4" height="17" rx="3"/><text class="val" x="523.4" y="457.2">28.13x</text></g><g class="row"><text class="lbl" x="292" y="480.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="468" width="217.4" height="17" rx="3"/><text class="val" x="523.4" y="480.2">28.14x</text></g><g class="row"><text class="lbl" x="292" y="503.2" text-anchor="end">Codon</text><rect class="bar k-codon" x="300" y="491" width="218.6" height="17" rx="3"/><text class="val" x="524.6" y="503.2">28.65x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="514" width="226.7" height="17" rx="3"/><text class="val" x="532.7" y="526.2">32.48x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="537" width="227.4" height="17" rx="3"/><text class="val" x="533.4" y="549.2">32.81x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="560" width="229.5" height="17" rx="3"/><text class="val" x="535.5" y="572.2">33.88x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="583" width="266.2" height="17" rx="3"/><text class="val" x="572.2" y="595.2">59.50x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="606" width="273.8" height="17" rx="3"/><text class="val" x="579.8" y="618.2">66.84x</text></g><g class="row"><text class="lbl" x="292" y="641.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="629" width="291.4" height="17" rx="3"/><text class="val" x="597.4" y="641.2">87.63x</text></g><g class="row"><text class="lbl" x="292" y="664.2" text-anchor="end">WebAssembly</text><rect class="bar k-wasm" x="300" y="652" width="318.6" height="17" rx="3"/><text class="val" x="624.6" y="664.2">132.97x</text></g><g class="row"><text class="lbl" x="292" y="687.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="675" width="350.8" height="17" rx="3"/><text class="val" x="656.8" y="687.2">218.10x</text></g></g><text class="sub" x="16" y="788">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="802">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.</text></svg>
