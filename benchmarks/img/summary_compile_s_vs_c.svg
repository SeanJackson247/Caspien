<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 883" width="900" height="883" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-wasm{--c:#9a7ee0}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="883" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Compile time: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of compile time / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="771"/><text class="tick" x="300.0" y="785" text-anchor="middle">0.1x</text><line class="grid" x1="412.5" x2="412.5" y1="6" y2="771"/><text class="tick" x="412.5" y="785" text-anchor="middle">1x</text><line class="grid" x1="525.0" x2="525.0" y1="6" y2="771"/><text class="tick" x="525.0" y="785" text-anchor="middle">10x</text><line class="grid" x1="637.5" x2="637.5" y1="6" y2="771"/><text class="tick" x="637.5" y="785" text-anchor="middle">100x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="771"/><text class="tick" x="750.0" y="785" text-anchor="middle">1000x</text><text class="tick" x="892" y="785" text-anchor="end">log scale</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="8" width="86.6" height="17" rx="3"/><text class="val" x="392.6" y="20.2">0.59x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="112.5" height="17" rx="3"/><text class="val" x="418.5" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="54" width="115.9" height="17" rx="3"/><text class="val" x="421.9" y="66.2">1.07x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">WebAssembly</text><rect class="bar k-wasm" x="300" y="77" width="116.2" height="17" rx="3"/><text class="val" x="422.2" y="89.2">1.08x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="100" width="123.6" height="17" rx="3"/><text class="val" x="429.6" y="112.2">1.26x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="123" width="128.7" height="17" rx="3"/><text class="val" x="434.7" y="135.2">1.39x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="146" width="156.5" height="17" rx="3"/><text class="val" x="462.5" y="158.2">2.46x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="169" width="160.9" height="17" rx="3"/><text class="val" x="466.9" y="18