="348.6" height="17" rx="3"/><text class="val" x="654.6" y="779.2">7476.96x</text></g><g class="row"><text class="lbl" x="292" y="802.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="790" width="369.9" height="17" rx="3"/><text class="val" x="675.9" y="802.2">12898.62x</text></g><g class="row"><text class="lbl" x="292" y="825.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="813" width="370.8" height="17" rx="3"/><text class="val" x="676.8" y="825.2">13191.01x</text></g></g><text class="sub" x="16" y="926">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="940">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.</text></svg>
