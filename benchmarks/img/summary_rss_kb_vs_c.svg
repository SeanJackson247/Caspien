" y="744" width="311.4" height="17" rx="3"/><text class="val" x="617.4" y="756.2">5.54x</text></g><g class="row"><text class="lbl" x="292" y="779.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="767" width="337.0" height="17" rx="3"/><text class="val" x="643.0" y="779.2">5.99x</text></g><g class="row"><text class="lbl" x="292" y="802.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="790" width="347.5" height="17" rx="3"/><text class="val" x="653.5" y="802.2">6.18x</text></g><g class="row"><text class="lbl" x="292" y="825.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="813" width="404.2" height="17" rx="3"/><text class="val" x="710.2" y="825.2">7.19x</text></g></g><text class="sub" x="16" y="926">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="940">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.</text></svg>
