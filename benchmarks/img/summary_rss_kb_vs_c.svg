.95x</text></g><g class="row"><text class="lbl" x="292" y="779.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="767" width="356.1" height="17" rx="3"/><text class="val" x="662.1" y="779.2">5.54x</text></g><g class="row"><text class="lbl" x="292" y="802.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="790" width="380.9" height="17" rx="3"/><text class="val" x="686.9" y="802.2">5.93x</text></g><g class="row"><text class="lbl" x="292" y="825.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="813" width="390.6" height="17" rx="3"/><text class="val" x="696.6" y="825.2">6.08x</text></g></g><text class="sub" x="16" y="926">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="940">C, C++ and Rust: free build. Caspien variants that exist only on some programs are averaged over those programs.</text></svg>
