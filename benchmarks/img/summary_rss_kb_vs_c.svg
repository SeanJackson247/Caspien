<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 952" width="900" height="952" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-wasm{--c:#9a7ee0}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="952" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Peak memory: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of peak memory / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="840"/><text class="tick" x="300.0" y="854" text-anchor="middle">0x</text><line class="grid" x1="364.3" x2="364.3" y1="6" y2="840"/><text class="tick" x="364.3" y="854" text-anchor="middle">1x</text><line class="grid" x1="428.6" x2="428.6" y1="6" y2="840"/><text class="tick" x="428.6" y="854" text-anchor="middle">2x</text><line class="grid" x1="492.9" x2="492.9" y1="6" y2="840"/><text class="tick" x="492.9" y="854" text-anchor="middle">3x</text><line class="grid" x1="557.1" x2="557.1" y1="6" y2="840"/><text class="tick" x="557.1" y="854" text-anchor="middle">4x</text><line class="grid" x1="621.4" x2="621.4" y1="6" y2="840"/><text class="tick" x="621.4" y="854" text-anchor="middle">5x</text><line class="grid" x1="685.7" x2="685.7" y1="6" y2="840"/><text class="tick" x="685.7" y="854" text-anchor="middle">6x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="840"/><text class="tick" x="750.0" y="854" text-anchor="middle">7x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="44.0" height="17" rx="3"/><text class="val" x="350.0" y="20.2">0.68x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="64.3" height="17" rx="3"/><text class="val" x="370.3" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="54" width="67.7" height="17" rx="3"/><text class="val" x="373.7" y="66.2">1.05x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="77" width="68.0" height="17" rx="3"/><text class="val" x="374.0" y="89.2">1.06x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="100" width="68.2" height="17" rx="3"/><text class="val" x="374.2" y="112.2">1.06x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">Caspien optimized (unsafe), everything on</text><rect class="bar k-caspien" x="300" y="123" width="70.6" height="17" rx="3"/><text class="val" x="376.6" y="135.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Caspien optimized (unsafe), tuned per program</text><rect class="bar k-caspien" x="300" y="146" width="70.6" height="17" rx="3"/><text class="val" x="376.6" y="158.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Caspien optimized (unsafe), optimisations off</text><rect class="bar k-caspien off" x="300" y="169" width="70.6" height="17" rx="3"/><text class="val" x="376.6" y="181.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="192" width="70.7" height="17" rx="3"/><text class="val" x="376.7" y="204.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="215" width="71.2" height="17" rx="3"/><text class="val" x="377.2" y="227.2">1.11x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Caspien optimized (safe), tuned per program</text><rect class="bar k-caspien" x="300" y="238" width="71.2" height="17" rx="3"/><text class="val" x="377.2" y="250.2">1.11x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="261" width="71.4" height="17" rx="3"/><text class="val" x="377.4" y="273.2">1.11x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="284" width="72.0" height="17" rx="3"/><text class="val" x="378.0" y="296.2">1.12x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="307" width="73.9" height="17" rx="3"/><text class="val" x="379.9" y="319.2">1.15x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="330" width="75.5" height="17" rx="3"/><text class="val" x="381.5" y="342.2">1.17x