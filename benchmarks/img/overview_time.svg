<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 791" width="900" height="791" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-wasm{--c:#9a7ee0}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="791" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Caspien against 23 other languages: execution time over 13 programs</text><text class="sub" x="16" y="40">Geometric mean of time / C -O2 time over the same 13 programs for every row. Lower is faster; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="679"/><text class="tick" x="300.0" y="693" text-anchor="middle">0x</text><line class="grid" x1="350.0" x2="350.0" y1="6" y2="679"/><text class="tick" x="350.0" y="693" text-anchor="middle">1x</text><line class="grid" x1="400.0" x2="400.0" y1="6" y2="679"/><text class="tick" x="400.0" y="693" text-anchor="middle">2x</text><line class="grid" x1="450.0" x2="450.0" y1="6" y2="679"/><text class="tick" x="450.0" y="693" text-anchor="middle">3x</text><line class="grid" x1="500.0" x2="500.0" y1="6" y2="679"/><text class="tick" x="500.0" y="693" text-anchor="middle">4x</text><line class="grid" x1="550.0" x2="550.0" y1="6" y2="679"/><text class="tick" x="550.0" y="693" text-anchor="middle">5x</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="679"/><text class="tick" x="600.0" y="693" text-anchor="middle">6x</text><line class="grid" x1="650.0" x2="650.0" y1="6" y2="679"/><text class="tick" x="650.0" y="693" text-anchor="middle">7x</text><line class="grid" x1="700.0" x2="700.0" y1="6" y2="679"/><text class="tick" x="700.0" y="693" text-anchor="middle">8x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="679"/><text class="tick" x="750.0" y="693" text-anchor="middle">9x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="48.6" height="17" rx="3"/><text class="val" x="354.6" y="20.2">0.97x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="50.0" height="17" rx="3"/><text class="val" x="356.0" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="54" width="51.7" height="17" rx="3"/><text class="val" x="357.7" y="66.2">1.03x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="77" width="54.0" height="17" rx="3"/><text class="val" x="360.0" y="89.2">1.08x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="100" width="55.2" height="17" rx="3"/><text class="val" x="361.2" y="112.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">D (LDC)</text><rect class="bar k-ldc" x="300" y="123" width="55.7" height="17" rx="3"/><text class="val" x="361.7" y="135.2">1.11x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="146" width="56.9" height="17" rx="3"/><text class="val" x="362.9" y="158.2">1.14x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Caspien optimized (safe), tuned per program</text><rect class="bar k-caspien" x="300" y="169" width="57.7" height="17" rx="3"/><text class="val" x="363.7" y="181.2">1.15x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="192" width="58.1" height="17" rx="3"/><text class="val" x="364.1" y="204.2">1.16x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">WebAssembly</text><rect class="bar k-wasm" x="300" y="215" width="58.3" height="17" rx="3"/><text class="val" x="364.3" y="227.2">1.17x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="238" width="60.5" height="17" rx="3"/><text class="val" x="366.5" y="250.2">1.21x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="261" width="64.4" height="17" rx="3"/><text class="val" x="370.4" y="273.2">1.29x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">D (GDC)</text><rect class="bar k-gdc" x="300" y="284" width="64.9" height="17" rx="3"/><text class="val" x="370.9" y="296.2">1.30x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="307" width="66.7" height="17" rx="3"/><text class="val" x="372.7" y="319.2">1.33x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">Codon</text><rect class="bar k-codon" x="300" y="330" width="71.1" height="17" rx="3"/><text class="val" x="377.1" y="342.2">1.42x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="353" width="75.5" height="17" rx="3"/><text class="val" x="381.5" y="365.2">1.51x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="376" width="76.2" height="17" rx="3"/><text class="val" x="382.2" y="388.2">1.52x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">C#</text><rect class="bar k-csharp" x="300" y="399" width="80.6" height="17" rx="3"/><text class="val" x="386.6" y="411.2">1.61x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="422" width="85.9" height="17" rx="3"/><text class="val" x="391.9" y="434.2">1.72x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="445" width="87.1" height="17" rx="3"/><text class="val" x="393.1" y="457.2">1.74x</text></g><g class="row"><text class="lbl" x="292" y="480.2" text-anchor="end">Swift</text><rect class="bar k-swift" x="300" y="468" width="87.8" height="17" rx="3"/><text class="val" x="393.8" y="480.2">1.76x</text></g><g class="row"><text class="lbl" x="292" y="503.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="491" width="88.8" height="17" rx="3"/><text class="val" x="394.8" y="503.2">1.78x</text></g><g class="row"><text class="lbl" x="292" y="526.2" text-anchor="end">Caspien naive, tuned per program</text><rect class="bar k-caspien" x="300" y="514" width="111.5" height="17" rx="3"/><text class="val" x="417.5" y="526.2">2.23x</text></g><g class="row"><text class="lbl" x="292" y="549.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="537" width="111.6" height="17" rx="3"/><text class="val" x="417.6" y="549.2">2.23x</text></g><g class="row"><text class="lbl" x="292" y="572.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="560" width="115.7" height="17" rx="3"/><text class="val" x="421.7" y="572.2">2.31x</text></g><g class="row"><text class="lbl" x="292" y="595.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="583" width="133.8" height="17" rx="3"/><text class="val" x="439.8" y="595.2">2.68x</text></g><g class="row"><text class="lbl" x="292" y="618.2" text-anchor="end">LuaJIT</text><rect class="bar k-luajit" x="300" y="606" width="144.0" height="17" rx="3"/><text class="val" x="450.0" y="618.2">2.88x</text></g><g class="row"><text class="lbl" x="292" y="641.2" text-anchor="end">Caspien optimized (safe), optimisations off</text><rect class="bar k-caspien off" x="300" y="629" width="247.3" height="17" rx="3"/><text class="val" x="553.3" y="641.2">4.95x</text></g><g class="row"><text class="lbl" x="292" y="664.2" text-anchor="end">Caspien naive, optimisations off</text><rect class="bar k-caspien off" x="300" y="652" width="448.2" height="17" rx="3"/><text class="val" x="754.2" y="664.2">8.96x</text></g></g><text class="sub" x="16" y="765">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="779">Fastest of 3 runs, Linux 2-core VM. Hello World and Mandelbrot (one Caspien variant) are excluded; unsafe variants are in the per-program charts.</text></svg>
