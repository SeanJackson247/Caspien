lbl" x="292" y="365.2" text-anchor="end">Bun</text><rect class="bar k-bun" x="300" y="353" width="286.7" height="17" rx="3"/><text class="val" x="592.7" y="365.2">3.82x</text></g><g class="row"><text class="lbl" x="292" y="388.2" text-anchor="end">Caspien naive, ref HashMap [2 programs]</text><rect class="bar k-caspien" x="300" y="376" width="373.5" height="17" rx="3"/><text class="val" x="679.5" y="388.2">4.98x</text></g><g class="row"><text class="lbl" x="292" y="411.2" text-anchor="end">Node</text><rect class="bar k-node" x="300" y="399" width="393.0" height="17" rx="3"/><text class="val" x="699.0" y="411.2">5.24x</text></g><g class="row"><text class="lbl" x="292" y="434.2" text-anchor="end">Java</text><rect class="bar k-java" x="300" y="422" width="420.4" height="17" rx="3"/><text class="val" x="726.4" y="434.2">5.61x</text></g><g class="row"><text class="lbl" x="292" y="457.2" text-anchor="end">Kotlin</text><rect class="bar k-kotlin" x="300" y="445" width="431.0" height="17" rx="3"/><text class="val" x="737.0" y="457.2">5.75x</text></g></g><text class="sub" x="16" y="558">Green = Caspien (hatched = optimisations off, solid = everything on), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="572">Safe filter: Caspien without unsafe-dynarray variants, GC/runtime-safe languages, Rust where rustc accepts the port under -F unsafe_code.</text></svg>
