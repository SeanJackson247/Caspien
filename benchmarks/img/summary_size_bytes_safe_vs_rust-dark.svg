<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#343a35;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#a1aaa2;font-size:11px}.lbl{fill:#e8ece6;font-size:12.5px}.val{fill:#e8ece6;font-size:12px}.grp{fill:#a1aaa2;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#e8ece6;font-size:15px;font-weight:600}.sub{fill:#a1aaa2;font-size:11.5px}.k-caspien{--c:#5cb37f}.k-c{--c:#e16e68}.k-cpp{--c:#f3978e}.k-rust{--c:#bb5954}.k-go{--c:#f5b7b0}.k-fortran{--c:#9a504c}.k-objc{--c:#cc817a}.k-odin{--c:#ed9381}.k-zig{--c:#d5728b}.k-chapel{--c:#f7c8c0}.k-ldc{--c:#e77869}.k-gdc{--c:#f3a497}.k-nim{--c:#c85f5a}.k-crystal{--c:#e18b7e}.k-ocaml{--c:#f9d1ca}.k-swift{--c:#d66578}.k-codon{--c:#ad5e59}.k-java{--c:#9769c8}.k-csharp{--c:#826ed4}.k-kotlin{--c:#c18be1}.k-wasm{--c:#b09ae7}.k-node{--c:#5d8fdf}.k-bun{--c:#9bc1f5}.k-luajit{--c:#4f72bb}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#28402f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5cb37f" stroke-width="2.4"/></pattern></defs><rect width="900" height="538" rx="8" fill="#1f2220" stroke="#3a413b"/><text class="ttl" x="16" y="24">Executable size: memory-safe implementations, relative to Rust -O (free build)</text><text class="sub" x="16" y="40">Geometric mean of executable size / Rust -O (free build) on the same program, over the programs where both exist. Lower is better; 1x = Rust -O (free build).</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="426"/><text class="tick" x="300.0" y="440" text-anchor="middle">0.001x</text><line class="grid" x1="390.0" x2="390.0" y1="6" y2="426"/><text class="tick" x="390.0" y="440" text-anchor="middle">0.01x</text><line class="grid" x1="480.0" x2="480.0