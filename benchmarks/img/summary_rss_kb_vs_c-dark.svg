<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 814" width="900" height="814" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#343a35;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#a1aaa2;font-size:11px}.lbl{fill:#e8ece6;font-size:12.5px}.val{fill:#e8ece6;font-size:12px}.grp{fill:#a1aaa2;font-size:10.5px}.hit{fill:transparent}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#e8ece6;font-size:15px;font-weight:600}.sub{fill:#a1aaa2;font-size:11.5px}.k-caspien{--c:#5cb37f}.k-c{--c:#e16e68}.k-cpp{--c:#f3978e}.k-rust{--c:#bb5954}.k-go{--c:#f5b7b0}.k-fortran{--c:#9a504c}.k-objc{--c:#cc817a}.k-odin{--c:#ed9381}.k-zig{--c:#d5728b}.k-chapel{--c:#f7c8c0}.k-ldc{--c:#e77869}.k-gdc{--c:#f3a497}.k-nim{--c:#c85f5a}.k-crystal{--c:#e18b7e}.k-ocaml{--c:#f9d1ca}.k-swift{--c:#d66578}.k-codon{--c:#ad5e59}.k-java{--c:#9769c8}.k-csharp{--c:#826ed4}.k-kotlin{--c:#c18be1}.k-wasm{--c:#b09ae7}.k-node{--c:#5d8fdf}.k-bun{--c:#9bc1f5}.k-luajit{--c:#4f72bb}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#28402f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5cb37f" stroke-width="2.4"/></pattern></defs><rect width="900" height="814" rx="8" fill="#1f2220" stroke="#3a413b"/><text class="ttl" x="16" y="24">Peak memory: every language, relative to C -O2</text><text class="sub" x="16" y="40">Geometric mean of peak memory / C -O2 on the same program, over the programs where both exist. Lower is better; 1x = C -O2.</text><g transform="translate(0,46)"><line class="grid" x1="300.0" x2="300.0" y1="6" y2="702"/><text class="tick" x="300.0" y="716" text-anchor="middle">0x</text><line class="grid" x1="364.3" x2="364.3" y1="6" y2="702"/><text class="tick" x="364.3" y="716" text-anchor="middle">1x</text><line class="grid" x1="428.6" x2="428.6" y1="6" y2="702"/><text class="tick" x="428.6" y="716" text-anchor="middle">2x</text><line class="grid" x1="492.9" x2="492.9" y1="6" y2="702"/><text class="tick" x="492.9" y="716" text-anchor="middle">3x</text><line class="grid" x1="557.1" x2="557.1" y1="6" y2="702"/><text class="tick" x="557.1" y="716" text-anchor="middle">4x</text><line class="grid" x1="621.4" x2="621.4" y1="6" y2="702"/><text class="tick" x="621.4" y="716" text-anchor="middle">5x</text><line class="grid" x1="685.7" x2="685.7" y1="6" y2="702"/><text class="tick" x="685.7" y="716" text-anchor="middle">6x</text><line class="grid" x1="750.0" x2="750.0" y1="6" y2="702"/><text class="tick" x="750.0" y="716" text-anchor="middle">7x</text><g class="row"><text class="lbl" x="292" y="20.2" text-anchor="end">Zig</text><rect class="bar k-zig" x="300" y="8" width="43.9" height="17" rx="3"/><text class="val" x="349.9" y="20.2">0.68x</text></g><g class="row"><text class="lbl" x="292" y="43.2" text-anchor="end">C -O2</text><rect class="bar k-c" x="300" y="31" width="64.3" height="17" rx="3"/><text class="val" x="370.3" y="43.2">1.00x</text></g><g class="row"><text class="lbl" x="292" y="66.2" text-anchor="end">Odin</text><rect class="bar k-odin" x="300" y="54" width="66.8" height="17" rx="3"/><text class="val" x="372.8" y="66.2">1.04x</text></g><g class="row"><text class="lbl" x="292" y="89.2" text-anchor="end">Rust -O</text><rect class="bar k-rust" x="300" y="77" width="68.2" height="17" rx="3"/><text class="val" x="374.2" y="89.2">1.06x</text></g><g class="row"><text class="lbl" x="292" y="112.2" text-anchor="end">Objective-C</text><rect class="bar k-objc" x="300" y="100" width="68.5" height="17" rx="3"/><text class="val" x="374.5" y="112.2">1.07x</text></g><g class="row"><text class="lbl" x="292" y="135.2" text-anchor="end">Caspien optimized (safe), everything on</text><rect class="bar k-caspien" x="300" y="123" width="70.5" height="17" rx="3"/><text class="val" x="376.5" y="135.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="158.2" text-anchor="end">Caspien optimized (unsafe), everything on</text><rect class="bar k-caspien" x="300" y="146" width="70.5" height="17" rx="3"/><text class="val" x="376.5" y="158.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="181.2" text-anchor="end">Nim</text><rect class="bar k-nim" x="300" y="169" width="70.6" height="17" rx="3"/><text class="val" x="376.6" y="181.2">1.10x</text></g><g class="row"><text class="lbl" x="292" y="204.2" text-anchor="end">C++ -O2</text><rect class="bar k-cpp" x="300" y="192" width="71.8" height="17" rx="3"/><text class="val" x="377.8" y="204.2">1.12x</text></g><g class="row"><text class="lbl" x="292" y="227.2" text-anchor="end">Fortran</text><rect class="bar k-fortran" x="300" y="215" width="73.9" height="17" rx="3"/><text class="val" x="379.9" y="227.2">1.15x</text></g><g class="row"><text class="lbl" x="292" y="250.2" text-anchor="end">Caspien naive, everything on</text><rect class="bar k-caspien" x="300" y="238" width="74.5" height="17" rx="3"/><text class="val" x="380.5" y="250.2">1.16x</text></g><g class="row"><text class="lbl" x="292" y="273.2" text-anchor="end">Go</text><rect class="bar k-go" x="300" y="261" width="76.4" height="17" rx="3"/><text class="val" x="382.4" y="273.2">1.19x</text></g><g class="row"><text class="lbl" x="292" y="296.2" text-anchor="end">Crystal</text><rect class="bar k-crystal" x="300" y="284" width="79.8" height="17" rx="3"/><text class="val" x="385.8" y="296.2">1.24x</text></g><g class="row"><text class="lbl" x="292" y="319.2" text-anchor="end">OCaml</text><rect class="bar k-ocaml" x="300" y="307" width="86.7" height="17" rx="3"/><text class="val" x="392.7" y="319.2">1.35x</text></g><g class="row"><text class="lbl" x="292" y="342.2" text-anchor="end">Chapel</text><rect class="bar k-chapel" x="300" y="330" width="102.4" height="17" rx="3"/><text class="val" x="408.4" y="342.2">1.59x</text></g><g class="row"><text class="lbl" x="292" y="365.2" text-anchor="end">D (LDC)</text><rect class="bar k-ldc" x="300" y="353" width=