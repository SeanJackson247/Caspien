ss="bar k-caspien off" x="270" y="215" width="357.9" height="17" rx="3"/><line class="noise" x1="625.9" x2="625.9" y1="215" y2="232"/><line class="noise" x1="629.9" x2="629.9" y1="215" y2="232"/><text class="val" x="635.9" y="227.2">20.33 s <tspan class="grp">Caspien</tspan></text></g></g><text class="sub" x="16" y="328">Green = Caspien (hatched = optimisations off), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="342">Gold lines: best time -/+ typical run-to-run noise (median repeat minus best).</text></svg>
