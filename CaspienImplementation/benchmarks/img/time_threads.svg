<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" width="900" height="354" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><style>.grid{stroke:#dfe3dc;stroke-width:1}.noise{stroke:#e0a800;stroke-width:1.6}.tick{fill:#5d665f;font-size:11px}.lbl{fill:#1d2320;font-size:12.5px}.val{fill:#1d2320;font-size:12px}.grp{fill:#5d665f;font-size:10.5px}.bar{fill:var(--c)}.bar.off{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}.ttl{fill:#1d2320;font-size:15px;font-weight:600}.sub{fill:#5d665f;font-size:11.5px}.k-caspien{--c:#2e9e5b}.k-c{--c:#d9453d}.k-cpp{--c:#ef7a6e}.k-rust{--c:#a82a24}.k-go{--c:#f2a39a}.k-fortran{--c:#7d1f1a}.k-objc{--c:#bd5e55}.k-odin{--c:#e8745d}.k-zig{--c:#c94a6a}.k-chapel{--c:#f5b8ae}.k-ldc{--c:#e0523f}.k-gdc{--c:#f08a7a}.k-nim{--c:#b8322c}.k-crystal{--c:#d86a5a}.k-ocaml{--c:#f7c4bb}.k-swift{--c:#ca3a52}.k-codon{--c:#96302a}.k-java{--c:#7a3fb8}.k-csharp{--c:#5f45c8}.k-kotlin{--c:#b06ad8}.k-node{--c:#2f6fd6}.k-bun{--c:#7fb0f2}.k-luajit{--c:#1d4aa8}.k-wasm{--c:#9a7ee0}</style><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe9d9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2e9e5b" stroke-width="2.4"/></pattern></defs><rect width="900" height="354" rx="8" fill="#ffffff" stroke="#d2d8cf"/><text class="ttl" x="16" y="24">Execution time: Thread spawn</text><text class="sub" x="16" y="40">1,024 tasks  |  fastest of 3 runs, Linux 2-core VM; every output equals the C reference</text><g transform="translate(0,46)"><line class="grid" x1="270.0" x2="270.0" y1="6" y2="242"/><text class="tick" x="270.0" y="256" text-anchor="middle">0</text><line class="grid" x1="380.0" x2="380.0" y1="6" y2="242"/><text class="tick" x="380.0" y="256" text-anchor="middle">2</text><line class="grid" x1="490.0" x2="490.0" y1="6" y2="242"/><text class="tick" x="490.0" y="256" text-anchor="middle">4</text><line class="grid" x1="600.0" x2="600.0" y1="6" y2="242"/><text cl