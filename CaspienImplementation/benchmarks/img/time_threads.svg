2="347.7" y1="100" y2="117"/><text class="val" x="353.7" y="112.2">1.39 s <tspan class="grp">Compiled + interpreted (VM)</tspan></text></g><g class="row" data-i="5"><text class="lbl" x="262" y="135.2" text-anchor="end">Caspien optimized · full</text><rect class="bar k-caspien" x="270" y="123" width="81.6" height="17" rx="3"/><line class="noise" x1="351.2" x2="351.2" y1="123" y2="140"/><line class="noise" x1="352.1" x2="352.1" y1="123" y2="140"/><text class="val" x="358.1" y="135.2">1.48 s <tspan class="grp">Caspien</tspan></text></g><g class="row" data-i="6"><text class="lbl" x="262" y="158.2" text-anchor="end">Caspien naive · full</text><rect class="bar k-caspien" x="270" y="146" width="81.9" height="17" rx="3"/><line class="noise" x1="348.2" x2="348.2" y1="146" y2="163"/><line class="noise" x1="355.5" x2="355.5" y1="146" y2="163"/><text class="val" x="361.5" y="158.2">1.49 s <tspan class="grp">Caspien</tspan></text></g><g class="row" data-i="7"><text class="lbl" x="262" y="181.2" text-anchor="end">Caspien optimized · off</text><rect class="bar k-caspien off" x="270" y="169" width="228.4" height="17" rx="3"/><line class="noise" x1="496.2" x2="496.2" y1="169" y2="186"/><line class="noise" x1="500.7" x2="500.7" y1="169" y2="186"/><text class="val" x="506.7" y="181.2">4.15 s <tspan class="grp">Caspien</tspan></text></g><g class="row" data-i="8"><text class="lbl" x="262" y="204.2" text-anchor="end">C -O0</text><rect class="bar k-c" x="270" y="192" width="229.3" height="17" rx="3"/><line class="noise" x1="497.4" x2="497.4" y1="192" y2="209"/><line class="noise" x1="501.2" x2="501.2" y1="192" y2="209"/><text class="val" x="507.2" y="204.2">4.17 s <tspan class="grp">Bare metal / native-compiled</tspan></text></g><g class="row" data-i="9"><text class="lbl" x="262" y="227.2" text-anchor="end">Caspien naive · off</text><rect class="bar k-caspien off" x="270" y="215" width="348.7" height="17" rx="3"/><line class="noise" x1="618.1" x2="618.1" y1="215" y2="232"/><line class="noise" x1="619.3" x2="619.3" y1="215" y2="232"/><text class="val" x="625.3" y="227.2">6.34 s <tspan class="grp">Caspien</tspan></text></g></g><text class="sub" x="16" y="328">Green = Caspien (hatched = optimisations off), red = native, purple = JVM/.NET/Wasm, blue = interpreted.</text><text class="sub" x="16" y="342">Gold lines: best time -/+ typical run-to-run noise (median repeat minus best).</text></svg>
